<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3F4B6E" />
    <title>ACA360 - Offline</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f9; color: #384551;
        }
        .card {
            background: #fff; border-radius: 12px; padding: 36px 32px; max-width: 380px; margin: 16px;
            text-align: center; box-shadow: 0 4px 18px rgba(38, 60, 85, .12);
        }
        img { width: 72px; height: 72px; }
        h1 { font-size: 20px; margin: 16px 0 8px; color: #3F4B6E; }
        p { font-size: 14px; line-height: 1.5; margin: 0 0 22px; color: #646e78; }
        button {
            background: #3F4B6E; color: #fff; border: 0; border-radius: 6px; padding: 10px 26px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #33405f; }
        @media (prefers-color-scheme: dark) {
            body { background: #1d2230; color: #d4d8e1; }
            .card { background: #2b3040; box-shadow: none; }
            h1 { color: #c7cff0; }
            p { color: #a9b0c0; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/medcom_logo_small.png" alt="" />
        <h1>You're offline</h1>
        <p>ACA360 needs an internet connection to show your data. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
